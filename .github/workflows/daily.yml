name: Daily AI Paper Tracker

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-paper-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect research papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          LOOKBACK_DAYS: "7"
          MAX_RESULTS: "150"
          MAX_NEW_PER_RUN: "15"
        run: python -m src.tracker
      - name: Commit updates when changed
        run: |
          if [[ -z "$(git status --porcelain -- data/papers.json reports/)" ]]; then
            echo "No new papers; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json reports/
          git commit -m "data: update arXiv paper digest"
          git push
